version: "3.9"

# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn app.main:app --workers 4 --host 0.0.0.0 --port 8000
    restart: always
    volumes: []  # No bind mount in prod — use COPY in Dockerfile

  worker:
    command: celery -A app.tasks.celery_app worker --loglevel=warning --concurrency=4
    restart: always
    volumes: []

  beat:
    restart: always
    volumes: []

  flower:
    restart: always
    volumes: []
    ports: []  # Don't expose Flower publicly in prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    command: node server.js
    restart: always
    volumes: []

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

  postgres:
    restart: always

  redis:
    restart: always

  ollama:
    restart: always
